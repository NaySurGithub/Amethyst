name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download PowerNukkitX
        run: curl --fail --location --retry 3 --output ../powernukkitx.jar https://github.com/PowerNukkitX/PowerNukkitX/releases/download/3.0.2/powernukkitx.jar

      - name: Build Amethyst
        run: |
          chmod +x gradlew
          ./gradlew build --build-cache --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
